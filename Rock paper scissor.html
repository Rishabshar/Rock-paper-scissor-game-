<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="Rock paper scissor.css" />
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  
  <div class="choices">
    <div class="choice" id="rock">
      <img src="https://img.freepik.com/free-psd/beautiful-stone-studio_23-2151860821.jpg?semt=ais_hybrid&w=740&q=80" />
    </div>
    <div class="choice" id="paper">
      <img src="https://png.pngtree.com/png-vector/20240815/ourmid/pngtree-white-ripped-paper-torn-edges-strips-isolated-on-background-png-image_13497364.png" />
    </div>
    <div class="choice" id="scissors">
      <img src="https://www.freeiconspng.com/uploads/scissors-icon-16.png" />
    </div>
  </div>
  
  <div class="score-board">
    <div class="score">
      <p id="user-score">0</p>
      <p>You</p>
    </div>
    <div class="score">
      <p id="comp-score">0</p>
      <p>Comp</p>
    </div>
  </div>

  <div>
    <button id="new-game-button">New Game</button>
    <button id="reset-button">Reset Game</button>
  </div>
  <br>

  <p id="msg">Choose your option:</p>

  <script src="Rock paper scissor.js"></script>
</body>
</html>
